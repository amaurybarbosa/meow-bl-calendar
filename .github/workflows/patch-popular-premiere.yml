name: Patch Popular Serizawa premiere

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-popular-premiere.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add premiere to calendar
        shell: python
        run: |
          from pathlib import Path

          path = Path('calendar.ics')
          text = path.read_text(encoding='utf-8')
          uid = 'popular-serizawa-ep1-20260810@meow-bl-calendar'

          if uid not in text:
              event = '''\nBEGIN:VEVENT\nUID:popular-serizawa-ep1-20260810@meow-bl-calendar\nDTSTAMP:20260814T221000Z\nDTSTART;VALUE=DATE:20260810\nDTEND;VALUE=DATE:20260811\nSUMMARY:📺 EP 1 • ESTREIA • O Garoto Popular é Estranho Comigo / Popular Serizawa Acts Weird around Me\nURL:https://meowbls.com/series/o-garoto-popular-e-estranho-comigo/\nTRANSP:TRANSPARENT\nEND:VEVENT\n'''
              text = text.replace('\nEND:VCALENDAR', event + '\nEND:VCALENDAR')
              path.write_text(text, encoding='utf-8')

      - name: Commit calendar update and remove temporary workflow
        run: |
          rm .github/workflows/patch-popular-premiere.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics .github/workflows/patch-popular-premiere.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add Popular Serizawa premiere"
          git push origin main
