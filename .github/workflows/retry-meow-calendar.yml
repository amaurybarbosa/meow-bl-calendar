name: Retry Meow calendar update
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed Meow releases
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date, timedelta
          import hashlib, re
          p=Path('calendar.ics'); s=p.read_text()
          def remove_matching(title, eps=None, final=False):
              global s
              blocks=s.split('BEGIN:VEVENT'); out=[blocks[0]]
              for b in blocks[1:]:
                  block='BEGIN:VEVENT'+b; m=re.search(r'SUMMARY:(.*)', block)
                  if not m or title not in m.group(1): out.append(b); continue
                  text=m.group(1)
                  if final and 'FINAL' in text: continue
                  if eps and any(re.search(rf'EP\s*{n}(?:\D|$)', text) for n in eps): continue
                  out.append(b)
              s=''.join(out)
          def add(title,d,summary,url):
              global s
              uid=hashlib.sha1(f'{title}|{d}|{summary}'.encode()).hexdigest()+'@meow-bl-calendar'
              if uid in s:return
              dt=date.fromisoformat(d); end=dt+timedelta(days=1)
              s+=f'\nBEGIN:VEVENT\nUID:{uid}\nDTSTAMP:20260826T170000Z\nDTSTART;VALUE=DATE:{d.replace("-","")}\nDTEND;VALUE=DATE:{end.strftime("%Y%m%d")}\nSUMMARY:{summary}\nURL:{url}\nTRANSP:TRANSPARENT\nEND:VEVENT\n'
          items=[
            ('Não Seja Tão Sentimental',[9],'📺 EP 9 • Não Seja Tão Sentimental / Don\'t Be Too Emotional','https://meowbls.com/series/nao-seja-tao-sentimental/'),
            ('Conectado a Você',[5,6],'📺 EP 5–6 • Conectado a Você / Connecting to You','https://meowbls.com/series/conectado-a-voce/'),
            ('Curso Básico de Esquisitice 101',[2],'📺 EP 2 • Curso Básico de Esquisitice 101','https://meowbls.com/series/curso-basico-de-esquisitice-101/'),
            ('Faça Dar Certo 2026',[6],'📺 EP 6 • Faça Dar Certo 2026 / Make it Right 2026','https://meowbls.com/series/faca-dar-certo-2026/'),
            ('Crush Colegial Complicado',[5],'📺 EP 5 • Crush Colegial Complicado / Class Crush Crisis','https://meowbls.com/series/crush-colegial-complicado/'),
            ('O Príncipe Servo',[8],'📺 EP 8 • O Príncipe Servo / The Servant Prince','https://meowbls.com/series/o-principe-servo/'),
            ('Cinzas',[3],'📺 EP 3 • Cinzas / Ash','https://meowbls.com/series/cinzas/'),
            ('Seu Terceiro',[5],'📺 EP 5 • Seu Terceiro / Your Third','https://meowbls.com/series/seu-terceiro/'),
            ('Amor Ao Cubo',[2],'📺 EP 2 • Amor Ao Cubo / Love x3','https://meowbls.com/series/amor-ao-cubo/'),
            ('Ponto Decisivo',[5],'📺 EP 5 • Ponto Decisivo / Match Point','https://meowbls.com/series/ponto-decisivo/'),
            ('Seu Verão, Minha Tempestade',[7],'📺 EP 7 • Seu Verão, Minha Tempestade','https://meowbls.com/series/seu-verao-minha-tempestade/'),
            ('Seu Céu: Japão',[4],'📺 EP 4 • Seu Céu: Japão','https://meowbls.com/series/seu-ceu-japao/'),
            ('Unhas de Garoto 2',[3],'📺 EP 3 • Unhas de Garoto 2','https://meowbls.com/series/unhas-de-garoto-2/'),
            ('A Linha do Horizonte',[10],'📺 EP 10 • A Linha do Horizonte','https://meowbls.com/series/a-linha-do-horizonte/'),
          ]
          for title,eps,summary,url in items:
              remove_matching(title,eps=eps); add(title,'2026-08-26',summary,url)
          for title,summary,url in [
            ('O Sol de Inverno Desperta o Vento no Sonho das Colinas da Primavera','📺 EP FINAL • O Sol de Inverno Desperta o Vento no Sonho das Colinas da Primavera','https://meowbls.com/series/o-sol-de-inverno-desperta-o-vento-no-sonho-das-colinas-da-primavera/'),
            ('Nosso Ensaio Particular','📺 EP 7–8 • FINAL • Nosso Ensaio Particular / Play Me','https://meowbls.com/series/nosso-ensaio-particular/')]:
              remove_matching(title,final=True); add(title,'2026-08-26',summary,url)
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('calendar.ics').read_text()
          required=['EP 9 • Não Seja Tão Sentimental','EP 5–6 • Conectado a Você','EP 2 • Curso Básico de Esquisitice 101','EP 6 • Faça Dar Certo 2026','EP 5 • Crush Colegial Complicado','EP 8 • O Príncipe Servo','EP 3 • Cinzas','EP 5 • Seu Terceiro','EP 2 • Amor Ao Cubo','EP 5 • Ponto Decisivo','EP 7 • Seu Verão, Minha Tempestade','EP 4 • Seu Céu: Japão','EP 3 • Unhas de Garoto 2','EP 10 • A Linha do Horizonte','FINAL • O Sol de Inverno Desperta o Vento no Sonho das Colinas da Primavera','EP 7–8 • FINAL • Nosso Ensaio Particular']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add calendar.ics
          git commit -m 'Update Meow releases for Aug 26'
          git push
          git rm .github/workflows/retry-meow-calendar.yml
          git commit -m 'Remove temporary Meow retry workflow'
          git push
