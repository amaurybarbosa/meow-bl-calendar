name: Complete premiere projections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-premiere-projections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add projected weekly episodes
        shell: python
        run: |
          from pathlib import Path

          path = Path('calendar.ics')
          text = path.read_text(encoding='utf-8')
          dtstamp = '20260815T225500Z'

          events = []

          # Wait a Minute, Harutora-kun — 10 episodes total.
          harutora_dates = {
              2: '20260821', 3: '20260828', 4: '20260904', 5: '20260911',
              6: '20260918', 7: '20260925', 8: '20261002', 9: '20261009', 10: '20261016'
          }
          for ep, date in harutora_dates.items():
              end = str(int(date) + 1)
              final = ' • FINAL' if ep == 10 else ''
              uid = f'harutora-ep{ep}-{date}@meow-bl-calendar'
              if uid not in text:
                  events.append(f'''BEGIN:VEVENT\nUID:{uid}\nDTSTAMP:{dtstamp}\nDTSTART;VALUE=DATE:{date}\nDTEND;VALUE=DATE:{end}\nSUMMARY:📺 EP {ep}{final} • Calma Aí\\, Harutora-kun / Wait a Minute\\, Harutora-kun\nURL:https://meowbls.com/series/calma-ai-harutora-kun/\nTRANSP:TRANSPARENT\nEND:VEVENT\n''')

          # Curso Básico de Esquisitice 101 / WEIRDO-101 — 8 episodes total.
          weirdo_dates = {
              2: '20260821', 3: '20260828', 4: '20260904', 5: '20260911',
              6: '20260918', 7: '20260925', 8: '20261002'
          }
          for ep, date in weirdo_dates.items():
              end = str(int(date) + 1)
              final = ' • FINAL' if ep == 8 else ''
              uid = f'weirdo101-ep{ep}-{date}@meow-bl-calendar'
              if uid not in text:
                  events.append(f'''BEGIN:VEVENT\nUID:{uid}\nDTSTAMP:{dtstamp}\nDTSTART;VALUE=DATE:{date}\nDTEND;VALUE=DATE:{end}\nSUMMARY:📺 EP {ep}{final} • Curso Básico de Esquisitice 101 / WEIRDO-101\nURL:https://meowbls.com/series/curso-basico-de-esquisitice-101/\nTRANSP:TRANSPARENT\nEND:VEVENT\n''')

          if events:
              text = text.replace('\nEND:VCALENDAR', '\n' + '\n'.join(events) + '\nEND:VCALENDAR')
              path.write_text(text, encoding='utf-8')

      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('calendar.ics').read_text(encoding='utf-8')
          assert text.startswith('BEGIN:VCALENDAR')
          assert text.rstrip().endswith('END:VCALENDAR')
          assert text.count('BEGIN:VEVENT') == text.count('END:VEVENT')
          PY
          rm .github/workflows/patch-premiere-projections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics .github/workflows/patch-premiere-projections.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: complete BL weekly projections"
          git push origin main
