name: Patch Harutora-kun premiere

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-harutora.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add premiere to calendar
        shell: python
        run: |
          from pathlib import Path

          path = Path('calendar.ics')
          text = path.read_text(encoding='utf-8')
          uid = '54a0cb5bc6b32cb9f3b4bf6c0954766edc15b5a1@meow-bl-calendar'

          if uid not in text:
              event = '''\nBEGIN:VEVENT\nUID:54a0cb5bc6b32cb9f3b4bf6c0954766edc15b5a1@meow-bl-calendar\nDTSTAMP:20260814T000300Z\nDTSTART;VALUE=DATE:20260813\nDTEND;VALUE=DATE:20260814\nSUMMARY:📺 EP 1 • ESTREIA • Calma Aí\\, Harutora-kun / Wait a Minute\\, Harutora-kun\nURL:https://meowbls.com/series/calma-ai-harutora-kun/\nTRANSP:TRANSPARENT\nEND:VEVENT\n'''
              text = text.replace('\nEND:VCALENDAR', event + '\nEND:VCALENDAR')
              path.write_text(text, encoding='utf-8')

      - name: Commit calendar update and remove temporary workflow
        run: |
          rm .github/workflows/patch-harutora.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics .github/workflows/patch-harutora.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add Harutora-kun premiere"
          git push origin main
