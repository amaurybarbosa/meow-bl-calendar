name: Patch missing Meow BL releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-missing-meow-bls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add missing releases
        shell: python
        run: |
          from pathlib import Path
          from datetime import date, timedelta
          import hashlib

          path = Path('calendar.ics')
          text = path.read_text(encoding='utf-8')
          dtstamp = '20260815T000000Z'
          blocks = []

          def add_event(key, day, summary, url=None):
              nonlocal_text = None
              uid = hashlib.sha1(f'{key}|{day.isoformat()}'.encode()).hexdigest() + '@meow-bl-calendar'
              if uid in text:
                  return
              end = day + timedelta(days=1)
              lines = [
                  'BEGIN:VEVENT',
                  f'UID:{uid}',
                  f'DTSTAMP:{dtstamp}',
                  f'DTSTART;VALUE=DATE:{day:%Y%m%d}',
                  f'DTEND;VALUE=DATE:{end:%Y%m%d}',
                  f'SUMMARY:{summary}',
              ]
              if url:
                  lines.append(f'URL:{url}')
              lines.extend(['TRANSP:TRANSPARENT', 'END:VEVENT'])
              blocks.append('\n'.join(lines))

          # Connecting to You — 13 episodes, Fridays, starting 14 Aug 2026.
          start = date(2026, 8, 14)
          for ep in range(1, 14):
              day = start + timedelta(days=7 * (ep - 1))
              marker = ' • ESTREIA' if ep == 1 else (' • FINAL' if ep == 13 else '')
              add_event(
                  f'connecting-to-you-ep{ep}',
                  day,
                  f'📺 EP {ep}{marker} • Connecting to You / 整個世界，只有你連上了我'
              )

          # WEIRDO-101 — 10 episodes, Fridays, starting 14 Aug 2026.
          for ep in range(1, 11):
              day = start + timedelta(days=7 * (ep - 1))
              marker = ' • ESTREIA' if ep == 1 else (' • FINAL' if ep == 10 else '')
              add_event(
                  f'weirdo-101-ep{ep}',
                  day,
                  f'📺 EP {ep}{marker} • WEIRDO-101 / แรงโน้มถ่วงระหว่างเรา'
              )

          # Meow also released the Fourever You Part 2 special episodes; this release was missing.
          add_event(
              'fourever-you-part2-specials',
              date(2026, 8, 11),
              '📺 EPISÓDIOS ESPECIAIS • Pr4 Sempre Você 2 / Fourever You Part 2',
              'https://meowbls.com/series/pr4-sempre-voce-2/'
          )

          if blocks:
              insertion = '\n\n' + '\n\n'.join(blocks) + '\n'
              text = text.replace('\nEND:VCALENDAR', insertion + '\nEND:VCALENDAR')
              path.write_text(text, encoding='utf-8')

      - name: Commit calendar update and remove temporary workflow
        run: |
          rm .github/workflows/patch-missing-meow-bls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics .github/workflows/patch-missing-meow-bls.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add missing Meow BL releases"
          git push origin main
