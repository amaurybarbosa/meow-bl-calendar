name: Patch Meow calendar 2026-08-16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-meow-20260816.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date, timedelta

          p = Path('calendar.ics')
          s = p.read_text(encoding='utf-8')
          if 'amor-ao-cubo-ep1-20260816@meow-bl-calendar' not in s:
              blocks = []
              blocks.append('''BEGIN:VEVENT
UID:amor-ao-cubo-ep1-20260816@meow-bl-calendar
DTSTAMP:20260816T220600Z
DTSTART;VALUE=DATE:20260816
DTEND;VALUE=DATE:20260817
SUMMARY:📺 EP 1 • ESTREIA • Amor Ao Cubo / Love³
URL:https://meowbls.com/series/amor-ao-cubo/
TRANSP:TRANSPARENT
END:VEVENT''')

              start = date(2026, 8, 16)
              for ep in range(1, 14):
                  d = start + timedelta(days=7*(ep-1))
                  d2 = d + timedelta(days=1)
                  final = ' • FINAL' if ep == 13 else ''
                  estreia = ' • ESTREIA' if ep == 1 else ''
                  blocks.append(f'''BEGIN:VEVENT
UID:conectado-a-voce-ep{ep}-{d.strftime('%Y%m%d')}@meow-bl-calendar
DTSTAMP:20260816T220600Z
DTSTART;VALUE=DATE:{d.strftime('%Y%m%d')}
DTEND;VALUE=DATE:{d2.strftime('%Y%m%d')}
SUMMARY:📺 EP {ep}{estreia}{final} • Conectado a Você / Connecting to You
URL:https://meowbls.com/series/conectado-a-voce/
TRANSP:TRANSPARENT
END:VEVENT''')

              insert = '\n\n' + '\n\n'.join(blocks) + '\n\n'
              s = s.replace('\nEND:VCALENDAR\n', insert + 'END:VCALENDAR\n')
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git commit -m "chore: add Aug 16 Meow BL releases" || true
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/patch-meow-20260816.yml
          git commit -m "chore: remove temporary Meow patch workflow"
          git push
